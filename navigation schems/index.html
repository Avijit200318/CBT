<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./style.css">
    <title>The JavaScript DSA Lab</title>
</head>

<body>
    <header>
        <h1>Navigation Scheme</h1>
    </header>
    <main>
        <div id="textInfo">
            <ul>
                <li><h3><i class="fa-regular fa-house"></i> <i class="fa-solid fa-arrow-right-long"></i> Contents</h3></li>
                <li><h3><i class="fa-solid fa-circle-arrow-right"></i> <i class="fa-solid fa-arrow-right-long"></i> Next Screen</h3></li>
                <li><h3><i class="fa-solid fa-circle-arrow-left"></i> <i class="fa-solid fa-arrow-right-long"></i> Previous Screen</h3></li>
                <li><h3><i class="fa-solid fa-xmark"></i> <i class="fa-solid fa-arrow-right-long"></i> Exit</h3></li>
                <li><h3><i class="fa-solid fa-backward"></i> <i class="fa-solid fa-arrow-right-long"></i> Back</h3></li>
                <li><h3><strong>3 / 20</strong> <i class="fa-solid fa-arrow-right-long"></i> Current Slide / Total Slide</h3></li>
            </ul>
        </div>
        <div id="moreInfo">
            <div>
                <a href="../target audience/index.html">
                    <button><i class="fa-solid fa-backward"></i></button>
                </a>
            </div>
        </div>
    </main>
    <footer>
        <div class="left">
            <a href="../index.html">
                <button><i class="fa-regular fa-house"></i></button>
            </a>
        </div>
        <div class="mid">
            <div id="pageNo">
                <p>2.2 / 20</p>
            </div>
        </div>
        <div class="right">
            <a href="../target audience/index.html">
                <button><i class="fa-regular fa-circle-left"></i></button>
            </a>
            <a href="../contents/index.html">
                <button><i class="fa-regular fa-circle-right"></i></button>
            </a>
            <button id="closeBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </footer>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"
    integrity="sha512-f6bQMg6nkSRw/xfHw5BCbISe/dJjXrVGfz9BSDwhZtiErHwk7ifbmBEtF9vFW8UNIQPhV2uEFVyI/UHob9r7Cw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="./index.js"></script>

</html>
